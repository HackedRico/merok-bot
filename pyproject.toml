[project]
name = "merok-bot"
version = "0.1.0"
description = "A chat assistant that helps someone post things that spread, and shows its work. HopHacks 2026, memetics track."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "pytz>=2024.1",
]

[project.optional-dependencies]
# nomic-embed needs sentence-transformers; the default hash embedder does not.
nomic = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Four top-level packages, no wrapper. They import as themselves.
[tool.hatch.build.targets.wheel]
packages = ["shared", "tools", "chat", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
